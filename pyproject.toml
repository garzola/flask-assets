[tool.poetry]
name = "flask-assets"
version = "0.1.0"
description = "A convenient way to add bootstrap, htmx, font awesome, and tom-select to your Flask app."
authors = ["Gustavo Arzola <gustavo@xcode.com>"]
readme = "README.md"
packages = [{ include = "flask_assets", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
flask = "^3.1.0"

[tool.poetry.group.dev.dependencies]
icecream = "^2.1.3"
ipdb = "^0.13.13"
mypy = "^1.8"
pytest = "^7.4.3"
ruff = "^0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
exclude = ["^.venv/.*",]
ignore_missing_imports = true
python_version = "3.12"



[tool.poetry.group.pylsp.dependencies]
python-lsp-server = "^1"
pylsp-mypy = "^0.6"
python-lsp-ruff = "^2"
