[tool.poetry]
name = "flask-assets"
version = "0.1.0"
description = "A convenient way to add bootstrap, htmx, font awesome, and tom-select to your Flask app."
authors = ["Gustavo Arzola <gustavo@xcode.com>"]
readme = "README.md"
packages = [{ include = "flask_assets", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
flask = "^3.1.0"

[tool.poetry.group.dev.dependencies]
icecream = "^2.1.3"
ipdb = "^0.13.13"
#mypy = "^1.8"
pytest = "^7.4.3"
coverage = "^7.6.10"
pytest-cov = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
