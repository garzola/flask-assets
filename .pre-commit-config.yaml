default_language_version:
  python: python3.12
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
              src/flask_assets/assets/.*|
              reports/.*|
          )$
      - id: check-case-conflict
      - id: trailing-whitespace
      - id: check-symlinks
      - id: check-toml
      - id: debug-statements
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.9.2
    hooks:
      # Run the linter.
      - id: ruff
        args: ["--fix", "--config", ".ruff.toml"]
      # Run the formatter.
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        language: python
        require_serial: true
        pass_filenames: false
        always_run: true
        entry: pytest --cov=flask_assets
  - repo: https://github.com/Weird-Sheep-Labs/coverage-pre-commit
    rev: 0.1.1
    hooks:
      - id: coverage-xml
        stages: [pre-commit]
      - id: coverage-badge
        stages: [pre-commit]
